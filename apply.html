<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply Now · Dharithri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- ============================================ -->
    <!-- NAVBAR IS AUTO-LOADED BY navbar.js          -->
    <!-- ============================================ -->

    <section class="container" style="padding: 40px 0 60px;">
        <h1 class="section-title text-center">Application Form</h1>
        <p class="section-sub text-center" style="margin:0 auto 30px;">Fill in all the details to start your journey with Dharithri.</p>

        <div class="form-section">
            <form id="applicationForm">
                <div id="formAlert"></div>

                <!-- Personal Details -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin-bottom:20px;"><i class="fas fa-user"></i> Personal Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name as per Aadhar Card <span class="required">*</span></label>
                        <input type="text" name="name" id="name" required placeholder="Enter your full name" />
                    </div>
                    <div class="form-group">
                        <label>Aadhar Number <span class="required">*</span></label>
                        <input type="text" name="aadhar" id="aadhar" required pattern="[0-9]{12}" title="Enter 12-digit Aadhar number" placeholder="Enter 12-digit Aadhar number" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mobile No: <span class="required">*</span></label>
                        <input type="tel" name="mobile" id="mobile" required pattern="[0-9]{10}" title="Enter 10-digit mobile number" placeholder="Enter 10-digit mobile number" />
                    </div>
                    <div class="form-group">
                        <label>Date Of Birth <span class="required">*</span></label>
                        <input type="date" name="dob" id="dob" required />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Gender: <span class="required">*</span></label>
                        <select name="gender" id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email ID <span class="required">*</span></label>
                        <input type="email" name="email" id="email" required placeholder="Enter your email address" />
                    </div>
                </div>
                <div class="form-group">
                    <label>Current Address <span class="required">*</span></label>
                    <textarea name="address" id="address" rows="2" required placeholder="Enter your current address"></textarea>
                </div>
                <div class="form-group">
                    <label>State <span class="required">*</span></label>
                    <input type="text" name="state" id="state" required placeholder="Enter your state" />
                </div>

                <!-- Family Details -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-users"></i> Family Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mother Name & Occupation <span class="required">*</span></label>
                        <input type="text" name="mother_name" id="mother_name" required placeholder="Mother's name and occupation" />
                    </div>
                    <div class="form-group">
                        <label>Father Name & Occupation <span class="required">*</span></label>
                        <input type="text" name="father_name" id="father_name" required placeholder="Father's name and occupation" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mother Mobile No:</label>
                        <input type="tel" name="mother_mobile" id="mother_mobile" pattern="[0-9]{10}" title="Enter 10-digit number" placeholder="Enter mother's mobile number" />
                    </div>
                    <div class="form-group">
                        <label>Father Mobile No:</label>
                        <input type="tel" name="father_mobile" id="father_mobile" pattern="[0-9]{10}" title="Enter 10-digit number" placeholder="Enter father's mobile number" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Siblings <span class="required">*</span></label>
                        <input type="text" name="siblings" id="siblings" required placeholder="Number of siblings" />
                    </div>
                    <div class="form-group">
                        <label>Religion: <span class="required">*</span></label>
                        <input type="text" name="religion" id="religion" required placeholder="Enter your religion" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Caste <span class="required">*</span></label>
                        <input type="text" name="caste" id="caste" required placeholder="Enter your caste" />
                    </div>
                    <div class="form-group">
                        <label>Annual Income: <span class="required">*</span></label>
                        <select name="annual_income" id="annual_income" required>
                            <option value="">Select Income Range</option>
                            <option>Below 1 Lakh</option>
                            <option>1-3 Lakhs</option>
                            <option>3-5 Lakhs</option>
                            <option>5-10 Lakhs</option>
                            <option>Above 10 Lakhs</option>
                        </select>
                    </div>
                </div>

                <!-- Education -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-graduation-cap"></i> Education Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Post Graduate Course Name: <span class="required">*</span></label>
                        <input type="text" name="pg_course" id="pg_course" required placeholder="e.g. MBA, MCA, etc." />
                    </div>
                    <div class="form-group">
                        <label>Graduation Course Name: <span class="required">*</span></label>
                        <input type="text" name="graduation_course" id="graduation_course" required placeholder="e.g. B.Tech, B.Com, etc." />
                    </div>
                </div>
                <div class="form-group">
                    <label>Academic year: <span class="required">*</span></label>
                    <input type="text" name="academic_year" id="academic_year" placeholder="e.g. 2020-2024" required />
                </div>

                <!-- Training Program -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-briefcase"></i> Training Program</h3>
                <div class="form-group">
                    <label>Banking Training Program Selection <span class="required">*</span></label>
                    <select name="program" id="program" required>
                        <option value="">Select a program</option>
                        <option>Sales Manager Training</option>
                        <option>Operations Manager Training</option>
                        <option>Risk Manager Training</option>
                        <option>Credit Manager Training</option>
                        <option>Legal Manager Training</option>
                        <option>Technical Manager Training</option>
                        <option>Accounts & Finance Training</option>
                        <option>Branch Banking Training</option>
                        <option>Liability Banking Training</option>
                        <option>Asset Banking Training</option>
                        <option>Team Supervisor Training</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>What is your main career goal? <span class="required">*</span></label>
                    <select name="career_goal" id="career_goal" required>
                        <option value="">Select Career Goal</option>
                        <option>Start a career in banking</option>
                        <option>Change my career</option>
                        <option>Improving my banking skills</option>
                        <option>Learn Loan Processing</option>
                    </select>
                </div>

                <!-- How Did You Hear -->
                <div class="form-group">
                    <label>How Did You Hear About Us? <span class="required">*</span></label>
                    <select name="how_did_you_know" id="how_did_you_know" required>
                        <option value="">Select</option>
                        <option>Google</option>
                        <option>Instagram</option>
                        <option>Facebook</option>
                        <option>Whatsapp</option>
                        <option>Youtube</option>
                        <option>Website</option>
                        <option>Friend/Family</option>
                        <option>Newspaper</option>
                        <option>Other</option>
                    </select>
                </div>

                <!-- Declaration -->
                <div class="form-group" style="margin-top:20px;">
                    <label style="display:flex; align-items:flex-start; gap:10px; font-weight:400; cursor:pointer;">
                        <input type="checkbox" name="declaration" id="declaration" required style="width:18px; height:18px; margin-top:2px; cursor:pointer;" />
                        <span>I confirm that the information provided by me is accurate. I agree to be contacted by Dharithri Manpower Training and Supply Pvt. Ltd. regarding banking training programs, course details, and career opportunities <span class="required">*</span></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-gold" style="padding:14px 50px; font-size:1.1rem; width:100%; margin-top:12px;">
                    <i class="fas fa-paper-plane"></i> Submit Application
                </button>
            </form>
        </div>
    </section>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // =============================================
        // FIREBASE CONFIGURATION
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log('✅ Firebase initialized!');

        // =============================================
        // FORM SUBMISSION - Instant Submit (No Resume)
        // =============================================
        document.getElementById('applicationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // Show loading state
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            submitBtn.disabled = true;

            document.getElementById('formAlert').innerHTML = '';

            try {
                // =============================================
                // COLLECT FORM DATA
                // =============================================
                const formData = {
                    name: document.getElementById('name')?.value || '',
                    aadhar: document.getElementById('aadhar')?.value || '',
                    mobile: document.getElementById('mobile')?.value || '',
                    dob: document.getElementById('dob')?.value || '',
                    gender: document.getElementById('gender')?.value || '',
                    email: document.getElementById('email')?.value || '',
                    address: document.getElementById('address')?.value || '',
                    state: document.getElementById('state')?.value || '',
                    mother_name: document.getElementById('mother_name')?.value || '',
                    father_name: document.getElementById('father_name')?.value || '',
                    mother_mobile: document.getElementById('mother_mobile')?.value || '',
                    father_mobile: document.getElementById('father_mobile')?.value || '',
                    siblings: document.getElementById('siblings')?.value || '',
                    religion: document.getElementById('religion')?.value || '',
                    caste: document.getElementById('caste')?.value || '',
                    annual_income: document.getElementById('annual_income')?.value || '',
                    pg_course: document.getElementById('pg_course')?.value || '',
                    graduation_course: document.getElementById('graduation_course')?.value || '',
                    academic_year: document.getElementById('academic_year')?.value || '',
                    program: document.getElementById('program')?.value || '',
                    career_goal: document.getElementById('career_goal')?.value || '',
                    how_did_you_know: document.getElementById('how_did_you_know')?.value || '',
                    declaration: document.getElementById('declaration')?.checked || false,
                    applicationDate: new Date().toISOString(),
                    status: 'pending'
                };

                // =============================================
                // VALIDATE DECLARATION
                // =============================================
                if (!formData.declaration) {
                    document.getElementById('formAlert').innerHTML = `
                        <div class="alert alert-error">
                            <strong>⚠️ Please accept the declaration</strong>
                            <p style="margin-top:4px;">You must agree to the terms and conditions to submit your application.</p>
                        </div>
                    `;
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                // =============================================
                // VALIDATE REQUIRED FIELDS
                // =============================================
                const requiredFields = ['name', 'aadhar', 'mobile', 'email', 'program', 'career_goal'];
                let missingFields = [];
                requiredFields.forEach(field => {
                    if (!formData[field] || formData[field] === '') {
                        missingFields.push(field);
                    }
                });

                if (missingFields.length > 0) {
                    document.getElementById('formAlert').innerHTML = `
                        <div class="alert alert-error">
                            <strong>⚠️ Please fill in all required fields</strong>
                            <p style="margin-top:4px;">Missing: ${missingFields.join(', ')}</p>
                        </div>
                    `;
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    return;
                }

                // =============================================
                // SAVE TO FIRESTORE - INSTANT SUBMIT
                // =============================================
                const docRef = await db.collection('applications').add(formData);
                
                console.log('✅ Application saved! ID:', docRef.id);

                // =============================================
                // SUCCESS MESSAGE
                // =============================================
                document.getElementById('formAlert').innerHTML = `
                    <div class="alert alert-success" style="padding:30px; border-radius:16px; background:#e8f5e9; border:2px solid #4caf50;">
                        <div style="text-align:center;">
                            <i class="fas fa-check-circle" style="font-size:4rem; color:#2e7d32;"></i>
                            <h2 style="color:#2e7d32; margin:16px 0 8px; font-size:2rem;">🎉 Thank You!</h2>
                            <h3 style="color:#2e7d32; font-size:1.3rem; margin-bottom:12px;">Your application has been submitted successfully.</h3>
                            <div style="background:white; padding:12px 24px; border-radius:8px; display:inline-block; margin:12px 0;">
                                <strong style="color:#0b2b4a;">Reference ID:</strong> 
                                <span style="color:#c49a2b; font-weight:700;">${docRef.id}</span>
                            </div>
                            <p style="color:#2e7d32; font-size:1rem; margin-top:16px;">
                                📧 A confirmation email will be sent to <strong>${formData.email}</strong>
                            </p>
                            <p style="color:#2e7d32; font-size:0.95rem; margin-top:8px;">
                                Our team will review your application and contact you within 2-3 business days.
                            </p>
                            <hr style="margin:20px 0; border:1px solid #a5d6a7;">
                            <p style="color:#2e7d32; font-size:0.85rem;">
                                <i class="fas fa-phone" style="color:#c49a2b;"></i> For queries: +91-XXXXXXXXXX &nbsp;|&nbsp; 
                                <i class="fas fa-envelope" style="color:#c49a2b;"></i> info@dharithri.com
                            </p>
                        </div>
                    </div>
                `;

                // =============================================
                // RESET FORM
                // =============================================
                document.getElementById('applicationForm').reset();
                
                // Scroll to top to show message
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error('❌ Error:', error);
                
                let errorMsg = error.message;
                if (error.code === 'permission-denied') {
                    errorMsg = 'Permission denied. Please check Firebase rules.';
                } else if (error.code === 'unavailable') {
                    errorMsg = 'Service unavailable. Please check your internet connection.';
                } else {
                    errorMsg = error.message || 'Unknown error occurred.';
                }
                
                document.getElementById('formAlert').innerHTML = `
                    <div class="alert alert-error">
                        <strong>❌ Submission Failed</strong>
                        <p style="margin-top:8px;">${errorMsg}</p>
                        <p style="margin-top:4px; font-size:0.85rem; color:#666;">Error code: ${error.code || 'Unknown'}</p>
                        <button onclick="location.reload()" style="margin-top:12px; background:#c49a2b; border:none; color:#0b2b4a; padding:10px 24px; border-radius:40px; cursor:pointer; font-weight:600;">
                            <i class="fas fa-sync"></i> Try Again
                        </button>
                    </div>
                `;
            } finally {
                // Re-enable button
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        console.log('✅ Application form ready!');
    </script>
</body>
</html>
