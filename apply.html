<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply Now · Dharithri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Navbar auto-loaded by navbar.js -->

    <section class="container" style="padding: 40px 0 60px;">
        <h1 class="section-title text-center">Application Form</h1>
        <p class="section-sub text-center" style="margin:0 auto 30px;">Fill in all the details to start your journey with Dharithri.</p>

        <div class="form-section">
            <form id="applicationForm" enctype="multipart/form-data">
                <div id="formAlert"></div>

                <!-- Personal Details -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin-bottom:20px;"><i class="fas fa-user"></i> Personal Details</h3>
                <div class="form-row">
                    <div class="form-group"><label>Name as per Aadhar Card <span class="required">*</span></label><input type="text" name="name" required /></div>
                    <div class="form-group"><label>Aadhar Number <span class="required">*</span></label><input type="text" name="aadhar" required pattern="[0-9]{12}" title="Enter 12-digit Aadhar number" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Mobile No: <span class="required">*</span></label><input type="tel" name="mobile" required pattern="[0-9]{10}" title="Enter 10-digit mobile number" /></div>
                    <div class="form-group"><label>Date Of Birth <span class="required">*</span></label><input type="date" name="dob" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Gender: <span class="required">*</span></label>
                        <select name="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
                    </div>
                    <div class="form-group"><label>Email I'd <span class="required">*</span></label><input type="email" name="email" required /></div>
                </div>
                <div class="form-group"><label>Current Address <span class="required">*</span></label><textarea name="address" rows="2" required></textarea></div>
                <div class="form-group"><label>State <span class="required">*</span></label><input type="text" name="state" required /></div>

                <!-- Family Details -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-users"></i> Family Details</h3>
                <div class="form-row">
                    <div class="form-group"><label>Mother Name & Occupation <span class="required">*</span></label><input type="text" name="mother" required /></div>
                    <div class="form-group"><label>Father Name & Occupation <span class="required">*</span></label><input type="text" name="father" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Mother Mobile No:</label><input type="tel" name="mother_mobile" pattern="[0-9]{10}" title="Enter 10-digit number" /></div>
                    <div class="form-group"><label>Father Mobile No:</label><input type="tel" name="father_mobile" pattern="[0-9]{10}" title="Enter 10-digit number" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Siblings <span class="required">*</span></label><input type="text" name="siblings" required /></div>
                    <div class="form-group"><label>Religion: <span class="required">*</span></label><input type="text" name="religion" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Caste <span class="required">*</span></label><input type="text" name="caste" required /></div>
                    <div class="form-group"><label>Annual Income: <span class="required">*</span></label>
                        <select name="income" required><option value="">Select</option><option>Below 1 Lakh</option><option>1-3 Lakhs</option><option>3-5 Lakhs</option><option>5-10 Lakhs</option><option>Above 10 Lakhs</option></select>
                    </div>
                </div>

                <!-- Education -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-graduation-cap"></i> Education Details</h3>
                <div class="form-row">
                    <div class="form-group"><label>Post Graduate Course Name: <span class="required">*</span></label><input type="text" name="pg_course" required /></div>
                    <div class="form-group"><label>Graduation Course Name: <span class="required">*</span></label><input type="text" name="grad_course" required /></div>
                </div>
                <div class="form-group"><label>Academic year: <span class="required">*</span></label><input type="text" name="academic_year" placeholder="e.g. 2020-2024" required /></div>

                <!-- Training Program -->
                <h3 style="color:#0b2b4a; border-bottom:2px solid #c49a2b; padding-bottom:8px; margin:30px 0 20px;"><i class="fas fa-briefcase"></i> Training Program</h3>
                <div class="form-group"><label>Banking Training Program Selection <span class="required">*</span></label>
                    <select name="program" required>
                        <option value="">Select a program</option>
                        <option>Sales Manager Training</option>
                        <option>Operations Manager Training</option>
                        <option>Risk Manager Training</option>
                        <option>Credit Manager Training</option>
                        <option>Legal Manager Training</option>
                        <option>Technical Manager Training</option>
                        <option>Accounts & Finance Training</option>
                        <option>Branch Banking Training</option>
                        <option>Liability Banking Training</option>
                        <option>Asset Banking Training</option>
                        <option>Team Supervisor Training</option>
                    </select>
                </div>
                <div class="form-group"><label>What is your main career goal? <span class="required">*</span></label>
                    <select name="career_goal" required>
                        <option value="">Select</option>
                        <option>Start a career in banking</option>
                        <option>Change my career</option>
                        <option>Improving my banking skills</option>
                        <option>Learn Loan Processing</option>
                    </select>
                </div>

                <!-- Resume Upload -->
                <div class="form-group"><label>Resume upload <span class="required">*</span> <span style="font-weight:400; color:#4a5d74;">(PDF, DOC, DOCX · Max 10 MB)</span></label>
                    <input type="file" name="resume" accept=".pdf,.doc,.docx" required />
                </div>

                <!-- How Did You Hear -->
                <div class="form-group"><label>How Did You Hear About Us? <span class="required">*</span></label>
                    <select name="source" required>
                        <option value="">Select</option>
                        <option>Google</option>
                        <option>Instagram</option>
                        <option>Facebook</option>
                        <option>Whatsapp</option>
                        <option>Youtube</option>
                        <option>Website</option>
                    </select>
                </div>

                <!-- Declaration -->
                <div class="form-group" style="margin-top:20px;">
                    <label style="display:flex; align-items:flex-start; gap:10px; font-weight:400;">
                        <input type="checkbox" name="declaration" required style="width:18px; height:18px; margin-top:2px;" />
                        <span>I confirm that the information provided by me is accurate. I agree to be contacted by Dharithri Manpower Training and Supply Pvt. Ltd. regarding banking training programs, course details, and career opportunities <span class="required">*</span></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-gold" style="padding:14px 50px; font-size:1.1rem; width:100%; margin-top:12px;">
                    <i class="fas fa-paper-plane"></i> Submit Application
                </button>
            </form>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // =============================================
        // FIREBASE CONFIGURATION
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log('✅ Firebase initialized!');

        // =============================================
        // FORM SUBMISSION
        // =============================================
        document.getElementById('applicationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form data - handle File objects properly
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => { 
                if (value instanceof File) {
                    data[key] = value.name || 'No file selected';
                } else {
                    data[key] = value;
                }
            });

            console.log('📤 Data being saved:', data);

            // Validate declaration
            if (!data.declaration) {
                alert('Please accept the declaration.');
                return;
            }

            // Add metadata
            data.applicationDate = new Date().toISOString();
            data.status = 'pending';

            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            submitBtn.disabled = true;

            // Save to Firestore
            db.collection('applications').add(data)
                .then((docRef) => {
                    console.log('✅ SUCCESS! Document ID:', docRef.id);
                    
                    // Show THANK YOU message
                    const alertDiv = document.getElementById('formAlert');
                    alertDiv.innerHTML = `
                        <div class="alert alert-success" style="padding:25px; border-radius:16px; background:#e8f5e9; border:2px solid #4caf50;">
                            <div style="text-align:center;">
                                <i class="fas fa-check-circle" style="font-size:3rem; color:#2e7d32;"></i>
                                <h2 style="color:#2e7d32; margin:12px 0 8px;">🎉 Thank You for Applying!</h2>
                                <p style="color:#2e7d32; font-size:1.1rem;">Your application has been submitted successfully.</p>
                                <p style="color:#2e7d32; font-size:0.9rem; margin-top:8px; background:white; padding:8px 16px; border-radius:8px; display:inline-block;">
                                    <strong>Reference ID:</strong> ${docRef.id}
                                </p>
                                <p style="color:#2e7d32; font-size:0.95rem; margin-top:12px;">
                                    📧 A confirmation email will be sent to <strong>${data.email}</strong>
                                </p>
                                <p style="color:#2e7d32; font-size:0.9rem; margin-top:8px;">
                                    Our team will review your application and contact you within 2-3 business days.
                                </p>
                                <hr style="margin:16px 0; border:1px solid #a5d6a7;">
                                <p style="color:#2e7d32; font-size:0.85rem;">
                                    <i class="fas fa-phone"></i> For queries: +91-XXXXXXXXXX &nbsp;|&nbsp; 
                                    <i class="fas fa-envelope"></i> info@dharithri.com
                                </p>
                            </div>
                        </div>
                    `;
                    
                    // Reset form
                    document.getElementById('applicationForm').reset();
                    
                    // Scroll to top to show message
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    // Auto-hide after 30 seconds
                    setTimeout(() => { 
                        alertDiv.innerHTML = ''; 
                    }, 30000);
                })
                .catch((error) => {
                    console.error('❌ ERROR:', error);
                    const alertDiv = document.getElementById('formAlert');
                    let errorMsg = error.message;
                    
                    if (error.code === 'permission-denied') {
                        errorMsg = 'Permission denied. Please check Firebase security rules.';
                    } else if (error.code === 'unavailable') {
                        errorMsg = 'Service unavailable. Please check your internet connection.';
                    } else if (error.code === 'not-found') {
                        errorMsg = 'Firestore database not found. Please check your Firebase configuration.';
                    }
                    
                    alertDiv.innerHTML = `
                        <div class="alert alert-error">
                            <strong>❌ Submission Failed</strong><br>
                            ${errorMsg}<br>
                            <small style="color:#666;">Error code: ${error.code}</small>
                        </div>
                    `;
                    setTimeout(() => { alertDiv.innerHTML = ''; }, 8000);
                })
                .finally(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                });

            // Safety timeout - reset button after 30 seconds
            setTimeout(() => {
                if (submitBtn.disabled) {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                    const alertDiv = document.getElementById('formAlert');
                    alertDiv.innerHTML = `
                        <div class="alert alert-error">
                            ⏱️ Submission timed out. Please try again.
                        </div>
                    `;
                    setTimeout(() => { alertDiv.innerHTML = ''; }, 5000);
                }
            }, 30000);
        });

        console.log('✅ Application form ready!');
    </script>
</body>
</html>
