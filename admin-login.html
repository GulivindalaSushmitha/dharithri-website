<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · Dharithri</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .login-container .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-container h2 {
            text-align: center;
            color: #0b2b4a;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .login-container p.sub {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .login-container input:focus {
            border-color: #c49a2b;
            outline: none;
        }
        .login-container button {
            width: 100%;
            padding: 14px;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover { background: #1a3f5e; }
        .login-container button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
        .success {
            color: #2e7d32;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub">Enter your credentials to access the dashboard</p>
        <form id="loginForm">
            <label for="adminEmail">Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@test.com" required>
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" required>
            <button type="submit" id="loginBtn">Login</button>
            <div id="loginError" class="error"></div>
        </form>
    </div>

    <!-- ============================================ -->
    <!-- FIREBASE SDK - LOADING WITH FALLBACK        -->
    <!-- ============================================ -->
    <script>
        // Check if Firebase SDK loads properly
        console.log('⏳ Loading Firebase SDK...');
    </script>
    
    <!-- Load Firebase SDK from CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        // Check if Firebase loaded successfully
        if (typeof firebase === 'undefined') {
            console.error('❌ Firebase failed to load!');
            document.getElementById('loginError').textContent = '❌ Firebase SDK failed to load. Please check your internet connection.';
            document.getElementById('loginError').style.color = '#d32f2f';
        } else {
            console.log('✅ Firebase loaded successfully!');
        }
    </script>
    
    <script>
        // ============================================
        // 🔥 FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        // Only initialize if Firebase loaded
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            
            console.log('✅ Firebase initialized!');
            
            // ============================================
            // 📝 LOGIN HANDLER
            // ============================================
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;
                const errorDiv = document.getElementById('loginError');
                const loginBtn = document.getElementById('loginBtn');
                
                errorDiv.textContent = '';
                errorDiv.className = 'error';
                
                if (!email || !password) {
                    errorDiv.textContent = '❌ Please enter both email and password';
                    return;
                }
                
                loginBtn.textContent = '⏳ Logging in...';
                loginBtn.disabled = true;
                
                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        console.log('✅ Login successful!', userCredential.user.email);
                        errorDiv.className = 'success';
                        errorDiv.textContent = '✅ Login successful! Redirecting...';
                        
                        setTimeout(() => {
                            window.location.href = 'admin-dashboard.html';
                        }, 1000);
                    })
                    .catch((error) => {
                        console.error('❌ Login error:', error.code, error.message);
                        loginBtn.textContent = 'Login';
                        loginBtn.disabled = false;
                        errorDiv.className = 'error';
                        
                        let errorMessage = error.message;
                        if (error.code === 'auth/user-not-found') {
                            errorMessage = 'User not found. Please check your email.';
                        } else if (error.code === 'auth/wrong-password') {
                            errorMessage = 'Incorrect password. Please try again.';
                        } else if (error.code === 'auth/too-many-requests') {
                            errorMessage = 'Too many failed attempts. Please wait 5 minutes.';
                        }
                        
                        errorDiv.textContent = '❌ ' + errorMessage;
                    });
            });
            
            // ============================================
            // 🔄 AUTO-LOGIN CHECK
            // ============================================
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('✅ User already logged in:', user.email);
                    window.location.href = 'admin-dashboard.html';
                }
            });
        } else {
            console.error('❌ Firebase not available. Login will not work.');
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = '⚠️ Firebase Not Loaded';
        }
    </script>
</body>
</html>
