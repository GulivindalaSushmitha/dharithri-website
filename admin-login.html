<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · Dharithri</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .login-container .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-container h2 {
            text-align: center;
            color: #0b2b4a;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .login-container p.sub {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .login-container input:focus {
            border-color: #c49a2b;
            outline: none;
        }
        .login-container button {
            width: 100%;
            padding: 14px;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover { background: #1a3f5e; }
        .login-container button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            padding: 10px;
            background: #ffebee;
            border-radius: 8px;
        }
        .success {
            color: #2e7d32;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
        }
        .demo-credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 13px;
            color: #4a5d74;
            text-align: center;
            border: 1px dashed #c49a2b;
        }
        .demo-credentials strong {
            color: #0b2b4a;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #4a5d74;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #0b2b4a;
            text-decoration: underline;
        }
        .firebase-status {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub">Enter your credentials to access the dashboard</p>
        
        <form id="loginForm">
            <label for="adminEmail">Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@dharithri.com" value="admin@dharithri.com" required>
            
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" value="admin123" required>
            
            <button type="submit" id="loginBtn">Login</button>
            <div id="loginError" class="error" style="display:none;"></div>
            <div id="loginSuccess" class="success" style="display:none;"></div>
        </form>
        
        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Email: <strong>admin@dharithri.com</strong><br>
            Password: <strong>admin123</strong>
        </div>
        <a href="index.html" class="back-link">← Back to Home</a>
        <div class="firebase-status" id="firebaseStatus">🔌 Connecting to Firebase...</div>
    </div>

    <!-- ============================================ -->
    <!-- FIREBASE SDK                                 -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        // ============================================
        // 🔥 FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // Show status
        document.getElementById('firebaseStatus').textContent = '✅ Firebase connected';
        document.getElementById('firebaseStatus').style.color = '#2e7d32';
        
        console.log('✅ Firebase initialized');
        console.log('Auth object:', auth);

        // ============================================
        // 📝 LOGIN HANDLER
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const loginBtn = document.getElementById('loginBtn');
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            console.log('🔐 Attempting login with:', email);
            
            if (!email || !password) {
                errorDiv.textContent = '❌ Please enter both email and password';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Show loading
            loginBtn.textContent = '⏳ Logging in...';
            loginBtn.disabled = true;
            
            // Attempt login
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    console.log('✅ Login successful!');
                    console.log('User:', userCredential.user.email);
                    
                    successDiv.textContent = '✅ Login successful! Redirecting...';
                    successDiv.style.display = 'block';
                    
                    // Redirect after 1 second
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error('❌ Login error:', error.code, error.message);
                    
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                    
                    let errorMessage = 'Invalid username or password. Please try again.';
                    
                    switch(error.code) {
                        case 'auth/user-not-found':
                            errorMessage = '❌ User not found. Please check your email.';
                            break;
                        case 'auth/wrong-password':
                            errorMessage = '❌ Incorrect password. Please try again.';
                            break;
                        case 'auth/too-many-requests':
                            errorMessage = '❌ Too many failed attempts. Please wait 5 minutes.';
                            break;
                        case 'auth/invalid-email':
                            errorMessage = '❌ Invalid email format.';
                            break;
                        case 'auth/network-request-failed':
                            errorMessage = '❌ Network error. Check your internet connection.';
                            break;
                        default:
                            errorMessage = '❌ ' + error.message;
                    }
                    
                    errorDiv.textContent = errorMessage;
                    errorDiv.style.display = 'block';
                });
        });

        // ============================================
        // 🔄 AUTO-LOGIN CHECK
        // ============================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('👤 User already logged in:', user.email);
                // If already logged in, redirect to dashboard
                window.location.href = 'admin-dashboard.html';
            } else {
                console.log('👤 No user logged in');
            }
        });

        // ============================================
        // 🐞 DEBUG: Check Firebase connection
        // ============================================
        console.log('🔍 Checking Firebase Auth...');
        auth.getRedirectResult().catch((error) => {
            console.log('Redirect result:', error);
        });
    </script>
</body>
</html>
