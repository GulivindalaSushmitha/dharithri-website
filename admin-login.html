<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login · Dharithri</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .login-container .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .login-container h2 {
            text-align: center;
            color: #0b2b4a;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .login-container p.sub {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .login-container input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .login-container input:focus {
            border-color: #c49a2b;
            outline: none;
        }
        .login-container button {
            width: 100%;
            padding: 14px;
            background: #0b2b4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover { background: #1a3f5e; }
        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p class="sub">Enter your credentials to access the dashboard</p>
        <form id="loginForm">
            <label for="adminEmail">Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@example.com" required>
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password" required>
            <button type="submit">Login</button>
            <div id="loginError" class="error"></div>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.textContent = '⏳ Logging in...';
            errorDiv.style.color = '#0b2b4a';
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    errorDiv.style.color = '#d32f2f';
                    errorDiv.textContent = '❌ ' + error.message;
                });
        });
    </script>
</body>
</html>
