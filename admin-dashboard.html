<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · Dharithri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== ADMIN STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .dashboard-header {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-wrap: wrap;
            gap: 15px;
        }
        .dashboard-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b4a;
        }
        .dashboard-header h1 span {
            font-weight: 300;
            color: #4a5d74;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-badge {
            background: #c49a2b;
            color: #0b2b4a;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .logout-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .logout-btn:hover { background: #b71c1c; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #0b2b4a;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: #4a5d74;
            margin-top: 4px;
        }
        
        .table-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow-x: auto;
        }
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-toolbar h3 {
            color: #0b2b4a;
            font-size: 1.1rem;
        }
        .search-box {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 40px;
            font-size: 14px;
            width: 250px;
            max-width: 100%;
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #c49a2b;
            outline: none;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: #0b2b4a;
            color: white;
            padding: 12px 16px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid #eef2f6;
            vertical-align: middle;
        }
        tr:hover td { background: #f8f9fb; }
        
        .program-badge {
            background: #c49a2b;
            color: #0b2b4a;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        
        /* ===== ACTION BUTTONS ===== */
        .action-cell {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-action i {
            font-size: 14px;
        }

        .btn-view-action {
            background: #4CAF50;
        }
        .btn-view-action:hover {
            background: #45a049;
            transform: scale(1.08);
        }

        .btn-resume-action {
            background: #FF6B6B;
        }
        .btn-resume-action:hover {
            background: #ff5252;
            transform: scale(1.08);
        }

        .btn-delete-action {
            background: #dc3545;
        }
        .btn-delete-action:hover {
            background: #c82333;
            transform: scale(1.08);
        }

        .no-resume-badge {
            color: #999;
            font-size: 10px;
            font-style: italic;
            padding: 4px 8px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: nowrap;
        }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #4a5d74;
        }
        .loading-state i {
            font-size: 2rem;
            color: #c49a2b;
        }
        .loading-state p {
            margin-top: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #4a5d74;
        }
        .empty-state i {
            font-size: 3rem;
            color: #c49a2b;
        }
        .empty-state h3 {
            margin: 12px 0;
            color: #0b2b4a;
        }
        
        .action-bar {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover { opacity: 0.85; }
        .action-btn.primary { background: #0b2b4a; color: white; }
        .action-btn.secondary { background: #4a5d74; color: white; }
        .action-btn.success { background: #2e7d32; color: white; }
        .action-btn.danger { background: #d32f2f; color: white; }
        
        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: auto;
        }
        .modal-content {
            background: white;
            margin: 40px auto;
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            position: relative;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #d32f2f; }
        .modal h2 {
            color: #0b2b4a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c49a2b;
        }
        .modal .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #eef2f6;
        }
        .modal .detail-label {
            font-weight: 600;
            width: 40%;
            color: #0b2b4a;
        }
        .modal .detail-value {
            width: 60%;
            color: #333;
            word-break: break-word;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 9999;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 400px;
        }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #d32f2f; }
        .toast.info { background: #0b2b4a; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast .close-toast {
            margin-left: 12px;
            cursor: pointer;
            opacity: 0.8;
        }
        .toast .close-toast:hover { opacity: 1; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            th, td { font-size: 0.8rem; padding: 8px 10px; }
            .dashboard-header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-actions { justify-content: center; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .table-toolbar { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .modal-content { margin: 20px; padding: 20px; }
            .modal .detail-row { flex-direction: column; }
            .modal .detail-label { width: 100%; }
            .modal .detail-value { width: 100%; padding-left: 10px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- NAVBAR IS AUTO-LOADED BY navbar.js          -->
    <!-- ============================================ -->

    <!-- ============================================ -->
    <!-- DASHBOARD SECTION                           -->
    <!-- ============================================ -->
    <div id="dashboardSection">
        <div class="container">
            <!-- Header -->
            <div class="dashboard-header">
                <h1>📊 Dharithri <span>Admin Dashboard</span></h1>
                <div class="header-actions">
                    <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
                    <button class="logout-btn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total Applications</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="todayCount">0</div>
                    <div class="label">Today's Applications</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="weekCount">0</div>
                    <div class="label">This Week</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="programCount">0</div>
                    <div class="label">Programs Selected</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-toolbar">
                    <h3><i class="fas fa-list"></i> All Applications</h3>
                    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by name, email, phone..." onkeyup="searchTable()">
                </div>
                <div style="overflow-x:auto; max-height: 550px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Mobile</th>
                                <th>Email</th>
                                <th>Program</th>
                                <th>Career Goal</th>
                                <th>Date</th>
                                <th style="text-align:center; min-width:150px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsBody">
                            <tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading applications...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="action-bar">
                    <button class="action-btn primary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="action-btn secondary" onclick="refreshData()"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="action-btn danger" onclick="deleteAll()"><i class="fas fa-trash"></i> Delete All</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- DETAIL MODAL                                 -->
    <!-- ============================================ -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2><i class="fas fa-user-circle"></i> Application Details</h2>
            <div id="modalBody"></div>
            <div style="margin-top:20px; padding-top:16px; border-top:2px solid #c49a2b; text-align:center;">
                <button onclick="closeModal()" style="background:#0b2b4a; color:white; border:none; padding:10px 30px; border-radius:40px; cursor:pointer; font-weight:600;">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- TOAST NOTIFICATION                          -->
    <!-- ============================================ -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- ============================================ -->
    <!-- FIREBASE SDK                                 -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script>
        // ============================================
        // 🔥 FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let allApplications = [];

        // ============================================
        // 🔐 PROTECTION
        // ============================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                console.log('✅ Admin logged in:', user.email);
                loadApplications();
            }
        });

        // ============================================
        // 🚪 LOGOUT
        // ============================================
        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.href = 'admin-login.html';
            }).catch((error) => {
                showToast('Logout failed: ' + error.message, 'error');
            });
        }

        // ============================================
        // 💬 TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerHTML = message + ' <span class="close-toast" onclick="this.parentElement.style.display=\'none\'">✕</span>';
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 5000);
        }

        // ============================================
        // 📊 LOAD APPLICATIONS
        // ============================================
        function loadApplications() {
            const tableBody = document.getElementById('applicationsBody');
            tableBody.innerHTML = '<tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading applications...</p></td></tr>';

            db.collection('applications')
                .orderBy('applicationDate', 'desc')
                .get()
                .then((snapshot) => {
                    if (snapshot.empty) {
                        tableBody.innerHTML = `
                            <tr><td colspan="8">
                                <div class="empty-state">
                                    <i class="fas fa-inbox"></i>
                                    <h3>No applications yet</h3>
                                    <p>Applications submitted through the website will appear here.</p>
                                </div>
                            </td></tr>
                        `;
                        updateStats([]);
                        allApplications = [];
                        return;
                    }

                    const applications = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        applications.push({ 
                            id: doc.id, 
                            ...data,
                            applicationDate: data.applicationDate || data.applied_on || data.created_at || new Date().toISOString()
                        });
                    });

                    allApplications = applications;
                    updateStats(applications);
                    renderTable(applications);
                    console.log('✅ Loaded', applications.length, 'applications');
                })
                .catch((error) => {
                    console.error('Error:', error);
                    tableBody.innerHTML = `
                        <tr><td colspan="8" style="text-align:center; padding:40px; color:#d32f2f;">
                            <i class="fas fa-exclamation-circle" style="font-size:2rem;"></i>
                            <p style="margin-top:12px;">Error loading applications: ${error.message}</p>
                            <button onclick="refreshData()" style="margin-top:12px; background:#c49a2b; border:none; color:#0b2b4a; padding:8px 24px; border-radius:40px; cursor:pointer; font-weight:600;">
                                <i class="fas fa-sync"></i> Try Again
                            </button>
                        </td></tr>
                    `;
                    showToast('Error loading applications', 'error');
                });
        }

        // ============================================
        // 📈 UPDATE STATS
        // ============================================
        function updateStats(applications) {
            const total = applications.length;
            const today = new Date();
            const todayStr = today.toDateString();
            const weekAgo = new Date(today);
            weekAgo.setDate(weekAgo.getDate() - 7);

            let todayCount = 0, weekCount = 0;
            const programs = new Set();

            applications.forEach(app => {
                const dateStr = app.applicationDate || app.applied_on || app.created_at;
                if (dateStr) {
                    try {
                        const appDate = new Date(dateStr);
                        if (appDate.toDateString() === todayStr) todayCount++;
                        if (appDate >= weekAgo) weekCount++;
                    } catch(e) {}
                }
                if (app.program) programs.add(app.program);
            });

            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('weekCount').textContent = weekCount;
            document.getElementById('programCount').textContent = programs.size;
            
            console.log('Stats Updated - Total:', total, 'Today:', todayCount, 'Week:', weekCount, 'Programs:', programs.size);
        }

        // ============================================
        // 📋 RENDER TABLE
        // ============================================
        function renderTable(applications) {
            const tableBody = document.getElementById('applicationsBody');
            
            if (applications.length === 0) {
                tableBody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h3>No matching records</h3>
                            <p>Try adjusting your search criteria.</p>
                        </div>
                    </td></tr>
                `;
                return;
            }

            let html = '';
            applications.forEach((app, index) => {
                const bgColor = index % 2 === 0 ? '#ffffff' : '#f8f9fb';
                
                let dateStr = 'N/A';
                const dateField = app.applicationDate || app.applied_on || app.created_at;
                if (dateField) {
                    try {
                        dateStr = new Date(dateField).toLocaleString('en-IN', {
                            day: '2-digit', month: 'short', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });
                    } catch(e) {
                        dateStr = 'N/A';
                    }
                }

                const hasResume = app.resume_url || app.resume;
                const resumeUrl = app.resume_url || '';

                html += `
                    <tr style="background:${bgColor};" id="row_${app.id}">
                        <td style="padding:10px 16px; font-weight:600;">${index + 1}</td>
                        <td style="padding:10px 16px; font-weight:600; color:#0b2b4a;">${app.name || 'N/A'}</td>
                        <td style="padding:10px 16px;">${app.mobile || app.father_mobile || 'N/A'}</td>
                        <td style="padding:10px 16px; font-size:0.85rem;">${app.email || 'N/A'}</td>
                        <td style="padding:10px 16px;">
                            <span class="program-badge">${app.program || app.course || 'N/A'}</span>
                        </td>
                        <td style="padding:10px 16px; font-size:0.85rem;">${app.career_goal || app.goal || 'N/A'}</td>
                        <td style="padding:10px 16px; font-size:0.8rem; white-space:nowrap;">${dateStr}</td>
                        <td style="padding:10px 16px;">
                            <div class="action-cell">
                                <!-- View Button -->
                                <button class="btn-action btn-view-action" onclick="viewApplication('${app.id}')" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                
                                <!-- Resume Button -->
                                ${hasResume ? `
                                    <button class="btn-action btn-resume-action" onclick="viewResume('${app.id}', '${resumeUrl}')" title="View Resume">
                                        <i class="fas fa-file-pdf"></i>
                                    </button>
                                ` : `
                                    <span class="no-resume-badge">No Resume</span>
                                `}
                                
                                <!-- Delete Button -->
                                <button class="btn-action btn-delete-action" onclick="deleteApplication('${app.id}', '${app.name || 'Unknown'}')" title="Delete Application">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        // ============================================
        // 🔍 SEARCH
        // ============================================
        function searchTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase().trim();
            
            if (filter === '') {
                renderTable(allApplications);
                return;
            }

            const filtered = allApplications.filter(app => {
                const name = (app.name || '').toLowerCase();
                const email = (app.email || '').toLowerCase();
                const mobile = (app.mobile || app.father_mobile || '').toString().toLowerCase();
                const program = (app.program || app.course || '').toLowerCase();
                return name.includes(filter) || email.includes(filter) || 
                       mobile.includes(filter) || program.includes(filter);
            });

            renderTable(filtered);
        }

        // ============================================
        // 👁️ VIEW APPLICATION
        // ============================================
        function viewApplication(docId) {
            console.log('Viewing application:', docId);
            
            db.collection('applications').doc(docId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        console.log('Application data:', data);
                        
                        let html = '';
                        
                        const fields = {
                            'Full Name': data.name,
                            'Aadhar Number': data.aadhar,
                            'Mobile Number': data.mobile || data.father_mobile,
                            'Email': data.email,
                            'Gender': data.gender,
                            'Date of Birth': data.dob,
                            'Address': data.address,
                            'State': data.state,
                            'City': data.city,
                            'Father\'s Name': data.father || data.father_name,
                            'Mother\'s Name': data.mother || data.mother_name,
                            'Siblings': data.siblings,
                            'Religion': data.religion,
                            'Caste': data.caste,
                            'Annual Income': data.income || data.annual_income,
                            'PG Course': data.pg_course,
                            'Graduation Course': data.grad_course || data.graduation_course,
                            'Academic Year': data.academic_year,
                            'Program Applied': data.program || data.course,
                            'Career Goal': data.career_goal || data.goal,
                            'How did you know?': data.source || data.how_did_you_know,
                            'Resume Uploaded': data.resume_url ? '✅ Yes' : (data.resume ? '✅ Yes (filename)' : '❌ No'),
                            'Applied On': data.applicationDate ? new Date(data.applicationDate).toLocaleString() : 
                                      data.applied_on ? new Date(data.applied_on).toLocaleString() : 'N/A'
                        };

                        for (const [key, value] of Object.entries(fields)) {
                            if (value && value !== 'N/A' && value !== '' && value !== 'undefined' && value !== '❌ No') {
                                html += `
                                    <div class="detail-row">
                                        <span class="detail-label">${key}</span>
                                        <span class="detail-value">${value}</span>
                                    </div>
                                `;
                            }
                        }

                        // Add Resume link if available
                        if (data.resume_url) {
                            html += `
                                <div class="detail-row" style="border-bottom: 2px solid #c49a2b; background: #f0f8ff;">
                                    <span class="detail-label">📎 Resume</span>
                                    <span class="detail-value">
                                        <a href="${data.resume_url}" target="_blank" style="color:#FF6B6B; font-weight:600; text-decoration:none;">
                                            <i class="fas fa-file-pdf"></i> View Resume
                                        </a>
                                    </span>
                                </div>
                            `;
                        } else if (data.resume) {
                            html += `
                                <div class="detail-row" style="border-bottom: 2px solid #c49a2b; background: #fff3e0;">
                                    <span class="detail-label">📎 Resume</span>
                                    <span class="detail-value">
                                        <span style="color: #e65100;">Resume file: ${data.resume}</span>
                                        <br>
                                        <button onclick="viewResume('${docId}', '')" style="background:#FF6B6B; color:white; border:none; padding:4px 12px; border-radius:4px; cursor:pointer; margin-top:4px;">
                                            <i class="fas fa-file-pdf"></i> Try to View
                                        </button>
                                    </span>
                                </div>
                            `;
                        }

                        if (html === '') {
                            html = '<p style="text-align:center;color:#666; padding:20px;">No details available for this application.</p>';
                        }

                        document.getElementById('modalBody').innerHTML = html;
                        document.getElementById('detailModal').style.display = 'block';
                    } else {
                        showToast('Application not found.', 'error');
                    }
                })
                .catch((error) => {
                    console.error('Error loading details:', error);
                    showToast('Error loading details: ' + error.message, 'error');
                });
        }

        // ============================================
        // 📄 VIEW RESUME - FIXED
        // ============================================
        function viewResume(docId, url) {
            console.log('Viewing resume for:', docId, 'URL:', url);
            
            // If URL is provided, open it
            if (url && url.startsWith('http')) {
                window.open(url, '_blank');
                return;
            }
            
            // If no URL, try to get from Firestore
            db.collection('applications').doc(docId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        console.log('Resume data:', data);
                        
                        if (data.resume_url) {
                            window.open(data.resume_url, '_blank');
                        } else if (data.resume) {
                            // Try to get download URL from Firebase Storage
                            const storageRef = storage.ref(`resumes/${data.resume}`);
                            storageRef.getDownloadURL()
                                .then((downloadURL) => {
                                    console.log('✅ Got download URL:', downloadURL);
                                    window.open(downloadURL, '_blank');
                                })
                                .catch((error) => {
                                    console.error('Error getting download URL:', error);
                                    showToast('Resume file not found in storage. Please check if the file was uploaded correctly.', 'error');
                                });
                        } else {
                            showToast('No resume uploaded for this application.', 'error');
                        }
                    } else {
                        showToast('Application not found.', 'error');
                    }
                })
                .catch((error) => {
                    console.error('Error loading resume:', error);
                    showToast('Error loading resume: ' + error.message, 'error');
                });
        }

        // ============================================
        // 🗑️ DELETE SINGLE APPLICATION
        // ============================================
        function deleteApplication(docId, name) {
            if (confirm(`⚠️ Are you sure you want to delete the application for "${name}"?\n\nThis action cannot be undone!`)) {
                db.collection('applications').doc(docId).get()
                    .then((doc) => {
                        if (doc.exists && doc.data().resume) {
                            const storageRef = storage.ref(`resumes/${doc.data().resume}`);
                            storageRef.delete().catch(() => {});
                        }
                        return db.collection('applications').doc(docId).delete();
                    })
                    .then(() => {
                        allApplications = allApplications.filter(app => app.id !== docId);
                        updateStats(allApplications);
                        renderTable(allApplications);
                        showToast(`✅ "${name}" deleted successfully!`, 'success');
                    })
                    .catch((error) => {
                        showToast('Error deleting: ' + error.message, 'error');
                    });
            }
        }

        // ============================================
        // 🗑️ DELETE ALL
        // ============================================
        function deleteAll() {
            if (allApplications.length === 0) {
                showToast('No applications to delete.', 'info');
                return;
            }

            if (confirm(`⚠️ Delete ALL ${allApplications.length} applications?`)) {
                if (confirm('⚠️ FINAL WARNING: This cannot be undone!')) {
                    const batch = db.batch();
                    allApplications.forEach(app => {
                        const ref = db.collection('applications').doc(app.id);
                        batch.delete(ref);
                        if (app.resume) {
                            storage.ref(`resumes/${app.resume}`).delete().catch(() => {});
                        }
                    });
                    
                    batch.commit()
                        .then(() => {
                            allApplications = [];
                            updateStats([]);
                            renderTable([]);
                            showToast('✅ All applications deleted!', 'success');
                        })
                        .catch((error) => {
                            showToast('Error: ' + error.message, 'error');
                        });
                }
            }
        }

        // ============================================
        // ❌ MODAL
        // ============================================
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('detailModal')) {
                closeModal();
            }
        }

        // ============================================
        // 📥 EXPORT CSV
        // ============================================
        function exportCSV() {
            if (allApplications.length === 0) {
                showToast('No data to export.', 'info');
                return;
            }

            const headers = ['Name', 'Aadhar', 'Mobile', 'Email', 'Program', 'Career Goal', 'Application Date'];
            let csv = headers.join(',') + '\n';

            allApplications.forEach(app => {
                let aadhar = app.aadhar || '';
                if (aadhar && !isNaN(aadhar) && aadhar.length > 10) {
                    aadhar = `="${aadhar}"`;
                }
                
                const dateField = app.applicationDate || app.applied_on || app.created_at || '';
                
                const row = [
                    `"${(app.name || '').replace(/"/g, '""')}"`,
                    `"${aadhar.replace(/"/g, '""')}"`,
                    `"${(app.mobile || app.father_mobile || '').replace(/"/g, '""')}"`,
                    `"${(app.email || '').replace(/"/g, '""')}"`,
                    `"${(app.program || app.course || '').replace(/"/g, '""')}"`,
                    `"${(app.career_goal || app.goal || '').replace(/"/g, '""')}"`,
                    `"${dateField.replace(/"/g, '""')}"`
                ];
                csv += row.join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `applications_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('✅ CSV exported!', 'success');
        }

        // ============================================
        // 🔄 REFRESH
        // ============================================
        function refreshData() {
            document.getElementById('applicationsBody').innerHTML = 
                '<tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Refreshing...</p></td></tr>';
            loadApplications();
            showToast('🔄 Refreshing...', 'info');
        }
    </script>

</body>
