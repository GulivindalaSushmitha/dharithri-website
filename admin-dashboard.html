<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · Dharithri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== ADDITIONAL ADMIN STYLES ===== */
        .action-cell {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-action i {
            font-size: 14px;
        }

        .btn-view-action {
            background: #4CAF50;
        }
        .btn-view-action:hover {
            background: #45a049;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(76,175,80,0.3);
        }

        .btn-resume-action {
            background: #FF6B6B;
        }
        .btn-resume-action:hover {
            background: #ff5252;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(255,107,107,0.3);
        }

        .btn-delete-action {
            background: #dc3545;
        }
        .btn-delete-action:hover {
            background: #c82333;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }

        .no-resume-badge {
            color: #999;
            font-size: 10px;
            font-style: italic;
            padding: 4px 8px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: nowrap;
        }

        .resume-link {
            color: #FF6B6B;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .resume-link:hover {
            text-decoration: underline;
        }

        /* Delete All button */
        .action-btn.danger {
            background: #d32f2f;
            color: white;
        }
        .action-btn.danger:hover {
            background: #b71c1c;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 9999;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 400px;
        }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #d32f2f; }
        .toast.info { background: #0b2b4a; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast .close-toast {
            margin-left: 12px;
            cursor: pointer;
            opacity: 0.8;
        }
        .toast .close-toast:hover { opacity: 1; }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- DASHBOARD SECTION                           -->
    <!-- ============================================ -->
    <div id="dashboardSection">
        <div class="container">
            <!-- Header -->
            <div class="dashboard-header">
                <h1>📊 Dharithri <span>Admin Dashboard</span></h1>
                <div class="header-actions">
                    <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
                    <button class="logout-btn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total Applications</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="todayCount">0</div>
                    <div class="label">Today's Applications</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="weekCount">0</div>
                    <div class="label">This Week</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="programCount">0</div>
                    <div class="label">Programs Selected</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-toolbar">
                    <h3><i class="fas fa-list"></i> All Applications</h3>
                    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by name, email, phone..." onkeyup="searchTable()">
                </div>
                <div style="overflow-x:auto; max-height: 550px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Mobile</th>
                                <th>Email</th>
                                <th>Program</th>
                                <th>Career Goal</th>
                                <th>Date</th>
                                <th style="text-align:center; min-width:130px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsBody">
                            <tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading applications...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="action-bar">
                    <button class="action-btn primary" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
                    <button class="action-btn secondary" onclick="refreshData()"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="action-btn danger" onclick="deleteAll()"><i class="fas fa-trash"></i> Delete All</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- DETAIL MODAL                                 -->
    <!-- ============================================ -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2><i class="fas fa-user-circle"></i> Application Details</h2>
            <div id="modalBody"></div>
            <div style="margin-top:20px; padding-top:16px; border-top:2px solid #c49a2b; text-align:center;">
                <button onclick="closeModal()" style="background:#0b2b4a; color:white; border:none; padding:10px 30px; border-radius:40px; cursor:pointer; font-weight:600;">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- TOAST NOTIFICATION                          -->
    <!-- ============================================ -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- ============================================ -->
    <!-- FIREBASE SDK                                 -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script>
        // ============================================
        // 🔥 FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyA7aJEk6jSaNDaLSgvmx6TVDtRpiinjTqs",
            authDomain: "dharithri-training.firebaseapp.com",
            projectId: "dharithri-training",
            storageBucket: "dharithri-training.firebasestorage.app",
            messagingSenderId: "54254956289",
            appId: "1:54254956289:web:753ecd7a1c6b53534a3500",
            measurementId: "G-NHEK585JRM"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let allApplications = [];

        // ============================================
        // 🔐 PROTECTION: Check if user is logged in
        // ============================================
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                console.log('✅ Admin logged in:', user.email);
                loadApplications();
            }
        });

        // ============================================
        // 🚪 LOGOUT HANDLER
        // ============================================
        function logoutAdmin() {
            auth.signOut()
                .then(() => {
                    window.location.href = 'admin-login.html';
                })
                .catch((error) => {
                    console.error('Logout error:', error);
                    showToast('Logout failed: ' + error.message, 'error');
                });
        }

        // ============================================
        // 💬 TOAST NOTIFICATION
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            
            // Add close button
            const closeBtn = document.createElement('span');
            closeBtn.className = 'close-toast';
            closeBtn.innerHTML = ' ✕';
            closeBtn.onclick = function() {
                toast.style.display = 'none';
            };
            toast.appendChild(closeBtn);
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // 📊 LOAD APPLICATIONS
        // ============================================
        function loadApplications() {
            const tableBody = document.getElementById('applicationsBody');
            tableBody.innerHTML = '<tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Loading applications...</p></td></tr>';

            db.collection('applications')
                .orderBy('applied_on', 'desc')
                .get()
                .then((snapshot) => {
                    if (snapshot.empty) {
                        tableBody.innerHTML = `
                            <tr><td colspan="8">
                                <div class="empty-state">
                                    <i class="fas fa-inbox"></i>
                                    <h3>No applications yet</h3>
                                    <p>Applications submitted through the website will appear here.</p>
                                </div>
                            </td></tr>
                        `;
                        updateStats([]);
                        allApplications = [];
                        return;
                    }

                    const applications = [];
                    snapshot.forEach((doc) => {
                        applications.push({ id: doc.id, ...doc.data() });
                    });

                    allApplications = applications;
                    updateStats(applications);
                    renderTable(applications);
                })
                .catch((error) => {
                    console.error('Error loading applications:', error);
                    tableBody.innerHTML = `
                        <tr><td colspan="8" style="text-align:center; padding:40px; color:#d32f2f;">
                            <i class="fas fa-exclamation-circle" style="font-size:2rem;"></i>
                            <p style="margin-top:12px;">Error loading applications: ${error.message}</p>
                            <button onclick="refreshData()" style="margin-top:12px; background:#c49a2b; border:none; color:#0b2b4a; padding:8px 24px; border-radius:40px; cursor:pointer; font-weight:600;">
                                <i class="fas fa-sync"></i> Try Again
                            </button>
                        </td></tr>
                    `;
                    showToast('Error loading applications: ' + error.message, 'error');
                });
        }

        // ============================================
        // 📈 UPDATE STATS
        // ============================================
        function updateStats(applications) {
            const total = applications.length;
            const today = new Date();
            const todayStr = today.toDateString();
            const weekAgo = new Date(today);
            weekAgo.setDate(weekAgo.getDate() - 7);

            let todayCount = 0;
            let weekCount = 0;
            const programs = new Set();

            applications.forEach(app => {
                if (app.applied_on) {
                    try {
                        const appDate = new Date(app.applied_on);
                        if (appDate.toDateString() === todayStr) todayCount++;
                        if (appDate >= weekAgo) weekCount++;
                    } catch(e) {}
                }
                if (app.program) programs.add(app.program);
            });

            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('weekCount').textContent = weekCount;
            document.getElementById('programCount').textContent = programs.size;
        }

        // ============================================
        // 📋 RENDER TABLE WITH ACTION BUTTONS
        // ============================================
        function renderTable(applications) {
            const tableBody = document.getElementById('applicationsBody');
            
            if (applications.length === 0) {
                tableBody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <h3>No matching records</h3>
                            <p>Try adjusting your search criteria.</p>
                        </div>
                    </td></tr>
                `;
                return;
            }

            let html = '';
            applications.forEach((app, index) => {
                const bgColor = index % 2 === 0 ? '#ffffff' : '#f8f9fb';
                
                let dateStr = 'N/A';
                if (app.applied_on) {
                    try {
                        dateStr = new Date(app.applied_on).toLocaleString('en-IN', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    } catch(e) {}
                }

                // Check if resume exists
                const hasResume = app.resume_url || app.resume;
                const resumeUrl = app.resume_url || '';

                html += `
                    <tr style="background:${bgColor};">
                        <td style="padding:10px 16px; font-weight:600;">${index + 1}</td>
                        <td style="padding:10px 16px; font-weight:600; color:#0b2b4a;">${app.name || 'N/A'}</td>
                        <td style="padding:10px 16px;">${app.mobile || 'N/A'}</td>
                        <td style="padding:10px 16px; font-size:0.85rem;">${app.email || 'N/A'}</td>
                        <td style="padding:10px 16px;">
                            <span class="program-badge">${app.program || 'N/A'}</span>
                        </td>
                        <td style="padding:10px 16px; font-size:0.85rem;">${app.career_goal || 'N/A'}</td>
                        <td style="padding:10px 16px; font-size:0.8rem; white-space:nowrap;">${dateStr}</td>
                        <td style="padding:10px 16px;">
                            <div class="action-cell">
                                <!-- View Button -->
                                <button class="btn-action btn-view-action" onclick="viewApplication('${app.id}')" title="View Details">
                                    <i class="fas fa-eye"></i>
                                </button>
                                
                                <!-- Resume Button -->
                                ${hasResume ? `
                                    <button class="btn-action btn-resume-action" onclick="viewResume('${app.id}', '${resumeUrl}')" title="View Resume">
                                        <i class="fas fa-file-pdf"></i>
                                    </button>
                                ` : `
                                    <span class="no-resume-badge">No Resume</span>
                                `}
                                
                                <!-- Delete Button -->
                                <button class="btn-action btn-delete-action" onclick="deleteApplication('${app.id}', '${app.name || 'Unknown'}')" title="Delete Application">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        // ============================================
        // 🔍 SEARCH TABLE
        // ============================================
        function searchTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase().trim();
            
            if (filter === '') {
                renderTable(allApplications);
                return;
            }

            const filtered = allApplications.filter(app => {
                const name = (app.name || '').toLowerCase();
                const email = (app.email || '').toLowerCase();
                const mobile = (app.mobile || '').toString().toLowerCase();
                const program = (app.program || '').toLowerCase();
                const career_goal = (app.career_goal || '').toLowerCase();
                return name.includes(filter) || 
                       email.includes(filter) || 
                       mobile.includes(filter) || 
                       program.includes(filter) ||
                       career_goal.includes(filter);
            });

            renderTable(filtered);
        }

        // ============================================
        // 👁️ VIEW APPLICATION DETAILS
        // ============================================
        function viewApplication(docId) {
            db.collection('applications').doc(docId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        let html = '';
                        
                        const fields = {
                            'Full Name': data.name,
                            'Aadhar Number': data.aadhar,
                            'Mobile Number': data.mobile,
                            'Email': data.email,
                            'Gender': data.gender,
                            'Date of Birth': data.dob,
                            'Address': data.address,
                            'State': data.state,
                            'Father\'s Name': data.father_name,
                            'Mother\'s Name': data.mother_name,
                            'Siblings': data.siblings,
                            'Religion': data.religion,
                            'Caste': data.caste,
                            'Annual Income': data.annual_income,
                            'PG Course': data.pg_course,
                            'Graduation Course': data.graduation_course,
                            'Academic Year': data.academic_year,
                            'Program Applied': data.program,
                            'Career Goal': data.career_goal,
                            'How did you know?': data.how_did_you_know,
                            'Resume Uploaded': data.resume_url ? '✅ Yes' : '❌ No',
                            'Applied On': data.applied_on ? new Date(data.applied_on).toLocaleString() : 'N/A'
                        };

                        for (const [key, value] of Object.entries(fields)) {
                            if (value && value !== 'N/A' && value !== '') {
                                html += `
                                    <div class="detail-row">
                                        <span class="detail-label">${key}</span>
                                        <span class="detail-value">${value}</span>
                                    </div>
                                `;
                            }
                        }

                        // Add Resume link if available
                        if (data.resume_url) {
                            html += `
                                <div class="detail-row" style="border-bottom: 2px solid #c49a2b;">
                                    <span class="detail-label">📎 Resume</span>
                                    <span class="detail-value">
                                        <a href="${data.resume_url}" target="_blank" style="color:#FF6B6B; font-weight:600; text-decoration:none;">
                                            <i class="fas fa-file-pdf"></i> View Resume
                                        </a>
                                    </span>
                                </div>
                            `;
                        }

                        if (html === '') {
                            html = '<p style="text-align:center;color:#666;">No details available.</p>';
                        }

                        document.getElementById('modalBody').innerHTML = html;
                        document.getElementById('detailModal').style.display = 'block';
                    } else {
                        showToast('Application not found.', 'error');
                    }
                })
                .catch((error) => {
                    showToast('Error loading details: ' + error.message, 'error');
                });
        }

        // ============================================
        // 📄 VIEW RESUME
        // ============================================
        function viewResume(docId, url) {
            if (url) {
                window.open(url, '_blank');
            } else {
                // If no URL in the document, try to get it from Firestore
                db.collection('applications').doc(docId).get()
                    .then((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.resume_url) {
                                window.open(data.resume_url, '_blank');
                            } else {
                                showToast('Resume not available for this application.', 'error');
                            }
                        } else {
                            showToast('Application not found.', 'error');
                        }
                    })
                    .catch((error) => {
                        showToast('Error loading resume: ' + error.message, 'error');
                    });
            }
        }

        // ============================================
        // 🗑️ DELETE SINGLE APPLICATION
        // ============================================
        function deleteApplication(docId, name) {
            if (confirm(`⚠️ Are you sure you want to delete the application for "${name}"?\n\nThis action cannot be undone!`)) {
                // Get the document first to check for resume
                db.collection('applications').doc(docId).get()
                    .then((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            
                            // Delete resume from Storage if it exists
                            if (data.resume) {
                                const storageRef = storage.ref(`resumes/${data.resume}`);
                                storageRef.delete()
                                    .then(() => {
                                        console.log('Resume deleted from storage');
                                    })
                                    .catch((error) => {
                                        console.log('Resume not found in storage, continuing...');
                                    });
                            }
                            
                            // Delete from Firestore
                            return db.collection('applications').doc(docId).delete();
                        }
                    })
                    .then(() => {
                        // Remove from local array
                        allApplications = allApplications.filter(app => app.id !== docId);
                        
                        // Remove row from table
                        const row = document.getElementById(`row_${docId}`);
                        if (row) row.remove();
                        
                        // Update stats
                        updateStats(allApplications);
                        
                        // Re-render table
                        renderTable(allApplications);
                        
                        showToast(`✅ Application for "${name}" deleted successfully!`, 'success');
                    })
                    .catch((error) => {
                        console.error('Error deleting:', error);
                        showToast('Error deleting application: ' + error.message, 'error');
                    });
            }
        }

        // ============================================
        // 🗑️ DELETE ALL APPLICATIONS
        // ============================================
        function deleteAll() {
            if (allApplications.length === 0) {
                showToast('No applications to delete.', 'info');
                return;
            }

            if (confirm(`⚠️ Are you sure you want to delete ALL ${allApplications.length} applications?\n\nThis action cannot be undone!`)) {
                if (confirm('⚠️ FINAL WARNING: This will permanently delete all applications!')) {
                    const batch = db.batch();
                    let resumeCount = 0;
                    
                    allApplications.forEach(app => {
                        const ref = db.collection('applications').doc(app.id);
                        batch.delete(ref);
                        
                        // Delete resume from storage if exists
                        if (app.resume) {
                            resumeCount++;
                            const storageRef = storage.ref(`resumes/${app.resume}`);
                            storageRef.delete().catch(() => {});
                        }
                    });
                    
                    batch.commit()
                        .then(() => {
                            allApplications = [];
                            updateStats([]);
                            renderTable([]);
                            showToast(`✅ ${allApplications.length} applications deleted successfully!`, 'success');
                        })
                        .catch((error) => {
                            showToast('Error deleting applications: ' + error.message, 'error');
                        });
                }
            }
        }

        // ============================================
        // ❌ CLOSE MODAL
        // ============================================
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // ============================================
        // 📥 EXPORT CSV (with Aadhar Fix)
        // ============================================
        function exportCSV() {
            if (allApplications.length === 0) {
                showToast('No data to export.', 'info');
                return;
            }

            // Define headers
            const headers = [
                'Name', 
                'Aadhar', 
                'Mobile', 
                'Email', 
                'Gender', 
                'State', 
                'Program', 
                'Career Goal', 
                'Annual Income', 
                'How Did You Know',
                'Application Date'
            ];
            
            let csv = headers.join(',') + '\n';

            allApplications.forEach(app => {
                // Format Aadhar with ="" to preserve full number in Excel
                let aadhar = app.aadhar || '';
                if (aadhar && !isNaN(aadhar) && aadhar.length > 10) {
                    aadhar = `="${aadhar}"`;
                }
                
                const row = [
                    `"${(app.name || '').replace(/"/g, '""')}"`,
                    `"${aadhar.replace(/"/g, '""')}"`,
                    `"${(app.mobile || '').replace(/"/g, '""')}"`,
                    `"${(app.email || '').replace(/"/g, '""')}"`,
                    `"${(app.gender || '').replace(/"/g, '""')}"`,
                    `"${(app.state || '').replace(/"/g, '""')}"`,
                    `"${(app.program || '').replace(/"/g, '""')}"`,
                    `"${(app.career_goal || '').replace(/"/g, '""')}"`,
                    `"${(app.annual_income || '').replace(/"/g, '""')}"`,
                    `"${(app.how_did_you_know || '').replace(/"/g, '""')}"`,
                    `"${(app.applied_on || '').replace(/"/g, '""')}"`
                ];
                csv += row.join(',') + '\n';
            });

            // Add BOM for UTF-8
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `dharithri_applications_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            
            showToast('✅ CSV exported successfully!', 'success');
        }

        // ============================================
        // 🔄 REFRESH DATA
        // ============================================
        function refreshData() {
            document.getElementById('applicationsBody').innerHTML = 
                '<tr><td colspan="8" class="loading-state"><i class="fas fa-spinner fa-spin"></i><p>Refreshing...</p></td></tr>';
            loadApplications();
            showToast('🔄 Refreshing data...', 'info');
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            // ESC to close modal
            if (e.key === 'Escape') {
                closeModal();
            }
            // Ctrl+F to focus search
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>

</body>
</html>
